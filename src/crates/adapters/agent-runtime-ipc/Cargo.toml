[package]
name = "opc-agent-runtime-ipc"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish = false
description = "Private pre-integration IPC seam for a shared OPC-Team Agent Runtime"

[lib]
name = "opc_agent_runtime_ipc"
crate-type = ["rlib"]

[dependencies]
async-trait = { workspace = true }
opc-transport = { path = "../transport" }
opc-events = { path = "../../contracts/events" }
opc-product-domains = { path = "../../contracts/product-domains" }
opc-runtime-ports = { path = "../../contracts/runtime-ports", features = ["agent-api", "git-port"] }
dunce = { workspace = true }
fs2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true
