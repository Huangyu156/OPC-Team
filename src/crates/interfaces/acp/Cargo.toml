[package]
name = "opc-acp"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OPC-Team Agent Client Protocol surface"

[features]
default = ["client", "server"]
client = [
    "opc-agent-tools/acp-bridge",
    "dep:futures",
    "dep:serde",
    "dep:dirs",
    "dep:semver",
    "dep:tar",
    "dep:opc-core",
    "opc-core/agent-runtime",
    "opc-core/ssh-remote",
]
server = [
    "dep:opc-agent-tools",
    "dep:opc-agent-runtime",
    "opc-agent-runtime/agent-runtime",
    "dep:opc-core-types",
    "dep:opc-core",
    "dep:sha2",
    "opc-core/agent-runtime",
    "opc-core/document-read",
    "opc-core/subscription-auth",
    "opc-core/external-sources",
    "opc-core/tools-basic",
    "opc-core/tools-git",
    "opc-core/tools-mcp",
    "opc-core/tools-browser-web",
    "opc-core/tools-computer-use",
    "opc-core/tools-image-analysis",
    "opc-core/tools-agent-control",
]

[lib]
name = "opc_acp"

[dependencies]
opc-core = { path = "../../assembly/core", optional = true }
opc-agent-runtime = { path = "../../execution/agent-runtime", optional = true }
opc-agent-tools = { path = "../../execution/tool-contracts", optional = true }
opc-events = { path = "../../contracts/events" }
opc-core-types = { path = "../../contracts/core-types", optional = true }

agent-client-protocol = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
futures = { workspace = true, optional = true }
async-trait = { workspace = true }
serde = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
