[package]
name = "opc-page-function-runtime"
version = "1.1.1"
authors = ["OPC-Team"]
edition = "2021"
description = "Embedded JS Page Function runtime for OPC-Team Pages (rquickjs)"

[lib]
name = "opc_page_function_runtime"
path = "src/lib.rs"

[dependencies]
# Versions stay explicit so the crate can build inside the standalone relay Docker context.
rquickjs = { version = "0.9", default-features = false, features = ["classes", "properties", "macro"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
