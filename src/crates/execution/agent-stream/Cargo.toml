[package]
name = "opc-agent-stream"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Lightweight agent stream processing for OPC-Team"

[lib]
name = "opc_agent_stream"
crate-type = ["rlib"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
opc-events = { path = "../../contracts/events" }
opc-core-types = { path = "../../contracts/core-types" }
futures = { workspace = true }
jsonrepair-rs = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
opc-agent-tools = { path = "../tool-contracts" }
tokio-stream = { workspace = true }

[lints]
workspace = true
