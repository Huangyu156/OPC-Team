[package]
name = "opc-config-contracts"
version.workspace = true
edition.workspace = true
description = "Persisted OPC-Team configuration contracts without product runtime"

[dependencies]
opc-core-types = { path = "../core-types" }
opc-product-domains = { path = "../product-domains" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
default = []
ts = ["dep:ts-rs", "opc-core-types/ts", "opc-product-domains/ts"]

[lints]
workspace = true
