[package]
name = "opc-desktop"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OPC-Team Desktop Application (Tauri)"

[lib]
name = "opc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "opc-desktop"
path = "src/main.rs"

[build-dependencies]
cc = { workspace = true }
tauri-build = { workspace = true }
serde_json = { workspace = true }

[dependencies]
opc-services-core = { path = "../../crates/services/services-core", features = ["pet-packages"] }
# Internal crates
opc-core = { path = "../../crates/assembly/core", features = ["product-full"] }
opc-relay-service = { path = "../../crates/services/relay-service" }
opc-agent-runtime = { path = "../../crates/execution/agent-runtime", features = ["agent-runtime"] }
opc-runtime-ports = { path = "../../crates/contracts/runtime-ports", features = ["agent-api", "permission", "workspace-ports"] }
opc-product-domains = { path = "../../crates/contracts/product-domains", features = ["appearance-market"] }
opc-services-integrations = { path = "../../crates/services/services-integrations", features = ["canvas-runtime", "miniapp-market", "skillhub", "remote-ssh-concrete", "speech-realtime"] }
opc-core-types = { path = "../../crates/contracts/core-types" }
opc-agent-tools = { path = "../../crates/execution/tool-contracts", features = ["element-token", "computer-use-contract"] }
opc-transport = { path = "../../crates/adapters/transport", features = ["tauri-adapter"] }
opc-events = { path = "../../crates/contracts/events" }
opc-webdriver = { path = "../../crates/adapters/webdriver" }
opc-acp = { path = "../../crates/interfaces/acp", default-features = false, features = ["client"] }

# Tauri
tauri = { workspace = true, features = ["unstable", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
keepawake = { workspace = true }
# Keep Tauri's transitive time resolution on the known-good release.
time = { workspace = true }
brotli-decompressor = { workspace = true }
alloc-no-stdlib = { workspace = true }
alloc-stdlib = { workspace = true }

# Inherited from workspace
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
dark-light = { workspace = true }
similar = { workspace = true }
ignore = { workspace = true }
mime_guess = { workspace = true }
urlencoding = { workspace = true }
reqwest = { workspace = true, features = ["http2", "json", "query", "rustls-no-provider", "stream"] }
semver = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
bzip2 = { workspace = true }
xz2 = { workspace = true }
zstd = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
minisign-verify = { workspace = true }
screenshots = { workspace = true }
enigo = { workspace = true }
# Controller-local drag thumbnails decode these formats; other files use UI icons.
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "webp"] }
resvg = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
bitflags = { workspace = true }
core-foundation = { workspace = true }
core-graphics = { workspace = true }
dispatch = { workspace = true }
foreign-types = { workspace = true }
libc = { workspace = true }
objc2 = { workspace = true, features = ["exception"] }
block2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-app-kit = { workspace = true, features = ["std", "libc", "NSAnimationContext", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "NSRunningApplication"] }
objc2-vision = { workspace = true, features = ["std", "VNRecognizeTextRequest", "VNRequest", "VNObservation", "VNRequestHandler", "VNUtils", "VNTypes", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
notify-rust = { workspace = true }
win32job = { workspace = true }
windows = { workspace = true, features = [
  "Foundation",
  "Globalization",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = { workspace = true }
webview2-com = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# Real Shell IDataObject fixtures for native drag-image lifecycle regressions.
windows = { workspace = true, features = ["Win32_UI_Shell_Common"] }

[features]
default = []
# Enable webview devtools and element inspector for development builds.
# Only active in debug builds or when explicitly requested via --features devtools.
# Never enabled in release profile intended for end users.
devtools = ["tauri/devtools", "opc-webdriver/embedded"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
atspi = { workspace = true, features = ["zbus"] }
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
leptess = { workspace = true }

[lints]
workspace = true

[[test]]
name = "computer_use_native_roundtrip"
path = "tests/computer_use_native_roundtrip.rs"
harness = false
required-features = ["devtools"]
