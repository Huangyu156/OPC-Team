name: Release Publish From Artifacts

# Publishes an existing release tag from the platform bundles produced by an
# earlier desktop-package.yml run.
#
# desktop-package.yml can only publish when its own build ran with
# upload_to_release=true, and that same input also turns on REQUIRE_SIGNING for
# the Windows Authenticode check. A build host without the CERTUM secrets
# therefore has to run with upload_to_release=false and cannot publish anything.
# This workflow separates the two concerns: it downloads the already built
# bundles, publishes their installers together with a SHA256SUMS manifest,
# checks every uploaded asset against the digest GitHub computes on upload, and
# never rebuilds or re-signs anything.
#
# Deliberate boundaries, do not "fix" them without reading the evidence:
#
# - It does not publish updater manifests (latest-v1.json, latest.json,
#   linux-binaries.json, minisign.pub). The desktop bundle is built without
#   updater artifacts on purpose: scripts/data-migrator-tauri-build.mjs deletes
#   bundle.createUpdaterArtifacts, scripts/desktop-tauri-build.test.mjs asserts
#   that bundle.createUpdaterArtifacts and plugins.updater are both absent, and
#   no .sig file exists in any bundle to sign a manifest with. The live update
#   feeds are owned by the upstream project
#   (https://github.com/GCWing/OPC-Team/releases/latest/download/latest-v1.json
#   and https://opcteam.eu.cc/release/latest-v1.json), so a release published
#   here deliberately does not move anyone's auto-update.
# - REQUIRE_SIGNING stays coupled to upload_to_release in desktop-package.yml.
#   That input means "this run is the signed official publication", and
#   unlinking it would add a second publish path that is silently unsigned.
#   A host without signing secrets publishes through this workflow instead.
# - Assets are whatever the downloaded bundles contain. A bundle whose package
#   job was skipped for that platform contributes only the files it has, so the
#   asset set varies per dispatch; each named artifact must yield at least one
#   file or the run fails.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.1.0
        required: true
        type: string
      version:
        description: Version without the tag prefix, for example 1.1.0
        required: true
        type: string
      run_id:
        description: Actions run id that produced the platform bundles
        required: true
        type: string
      artifacts:
        description: Comma separated bundle artifact names to publish
        required: true
        type: string
      notes_file:
        description: Repository path of the release notes file, empty to generate notes
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download platform bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          # Read the last entry even when the input has no trailing newline.
          while IFS= read -r name || [ -n "${name}" ]; do
            [ -z "${name}" ] && continue
            echo "downloading artifact ${name}"
            gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" -n "${name}" -D "bundle/${name}"
            file_count="$(find "bundle/${name}" -type f | wc -l)"
            echo "artifact ${name} produced ${file_count} file(s)"
            if [ "${file_count}" -eq 0 ]; then
              echo "::error::artifact ${name} produced no files"
              exit 1
            fi
          done < <(printf '%s\n' "${ARTIFACTS}" | tr ',' '\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/d')
          echo "downloaded bundle files:"
          find bundle -type f -printf '%10s %p\n' | sort -k2

      - name: Stage release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          rm -rf upload
          mkdir -p upload

          # The published Windows installer is the bundled opc-installer.exe
          # republished under the product release name.
          node scripts/prepare-windows-installer-asset.mjs \
            --assets-dir bundle \
            --version "${VERSION}" \
            --out-dir upload \
            || echo "::warning::the windows manual installer asset was not produced; publishing the raw bundle files only"

          while IFS= read -r -d '' file; do
            base="$(basename "${file}")"
            dest="upload/${base}"
            if [ -e "${dest}" ]; then
              echo "::error::two bundle files would publish the same asset name ${base}: ${file}"
              exit 1
            fi
            cp -v "${file}" "${dest}"
          done < <(find bundle -type f \( \
            -iname '*-setup.exe' -o \
            -iname '*.dmg' -o \
            -iname '*.AppImage' -o \
            -iname '*.deb' -o \
            -iname '*.rpm' -o \
            -iname '*.sig' -o \
            -iname 'minisign.pub' \
            \) -print0)

          echo "staged release assets:"
          find upload -maxdepth 1 -type f -printf '%10s %f\n' | sort -k2

          if [ -z "$(ls -A upload)" ]; then
            echo "::error::no release assets were staged"
            exit 1
          fi

          while IFS= read -r -d '' file; do
            size="$(stat -c '%s' "${file}")"
            if [ "${size}" -lt 1048576 ]; then
              echo "::error::staged asset ${file} is only ${size} bytes"
              exit 1
            fi
          done < <(find upload -maxdepth 1 -type f -print0)

          # A download can then be checked with "sha256sum -c SHA256SUMS".
          # The manifest is written outside upload/ first so the glob expansion
          # cannot pick up the manifest itself.
          ( cd upload && LC_ALL=C sha256sum * ) > SHA256SUMS.gen
          mv SHA256SUMS.gen upload/SHA256SUMS

          echo "checksum manifest:"
          cat upload/SHA256SUMS

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; adding assets to it"
          elif [ -n "${NOTES_FILE}" ] && [ -f "${NOTES_FILE}" ]; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --title "OPC-Team ${VERSION}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --title "OPC-Team ${VERSION}" \
              --generate-notes
          fi
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber upload/*
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,assets \
            --jq '{isDraft: .isDraft, assets: [.assets[] | "\(.name) \(.size)"]}'

      - name: Verify uploaded digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          digests="${RUNNER_TEMP}/remote-digests.txt"
          missing=""
          for attempt in 1 2 3 4 5; do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq '.assets[] | "\(.name) \(.digest)"' > "${digests}"
            missing="$(awk 'NR==FNR { want[$2]=1; next } $2 ~ /^sha256:/ { have[$1]=1 } END { for (n in want) if (!(n in have)) print n }' upload/SHA256SUMS "${digests}")"
            if [ -z "${missing}" ]; then
              break
            fi
            echo "GitHub has not reported a sha256 digest for: ${missing} (attempt ${attempt})"
            sleep 5
          done
          if [ -n "${missing}" ]; then
            echo "::error::GitHub did not report a sha256 digest for every uploaded asset"
            exit 1
          fi
          while read -r local_sum name; do
            remote="$(awk -v n="${name}" '$1==n { print $2 }' "${digests}")"
            if [ "${remote}" != "sha256:${local_sum}" ]; then
              echo "::error::digest mismatch for ${name}: local ${local_sum}, remote ${remote}"
              exit 1
            fi
          done < upload/SHA256SUMS
          echo "every uploaded asset matches its local sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          count="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')"
          if [ "${count}" -lt 2 ]; then
            echo "::error::release ${TAG} has only ${count} asset(s); it stays a draft"
            exit 1
          fi
          gh release edit "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OPC-Team ${VERSION}" \
            --draft=false \
            --latest
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isDraft,isPrerelease,publishedAt,assets \
            --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, publishedAt: .publishedAt, assets: [.assets[] | "\(.name) \(.size)"]}'
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 3
